[env:adafruit_qtpy_esp32s2]
platform = espressif32
board = adafruit_qtpy_esp32s2
framework = arduino
monitor_speed = 19200

lib_deps = 
	erropix/ESP32 AnalogWrite@^0.2
	adafruit/Adafruit NeoPixel@^1.10.5
