; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_qtpy_esp32s2]
platform = espressif32@6.5.0
board = adafruit_qtpy_esp32s2
framework = arduino
monitor_speed = 115200

; The QT Py definition sets ARDUINO_USB_CDC_ON_BOOT=1, which starts a
; highest-priority USB task before setup(). On this single-core chip that
; task stalls Wi-Fi and loop() whenever the USB host is idle.
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	-UARDUINO_USB_CDC_ON_BOOT
	-DARDUINO_USB_CDC_ON_BOOT=0
extra_scripts = pre:print_cmd.py

lib_deps = 
	adafruit/Adafruit NeoPixel@^1.10.5
